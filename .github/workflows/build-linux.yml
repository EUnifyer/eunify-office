name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 420
    env:
      OFFICE_DIST_TOKEN: ${{ secrets.OFFICE_DIST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache zip \
            gcc-12 g++-12 \
            autoconf automake libtool pkg-config gperf \
            meson ninja-build \
            python3-dev python3-lxml \
            bison flex nasm \
            openjdk-17-jdk ant junit4 \
            libxml2-utils xsltproc libxslt1-dev \
            libcups2-dev libfontconfig1-dev libxrandr-dev \
            libxinerama-dev libgl1-mesa-dev libgtk-3-dev \
            libxrender-dev libxext-dev \
            libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libkrb5-dev libnss3-dev \
            librsvg2-bin imagemagick
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))" >> $GITHUB_ENV
          # LibreOffice master needs GCC >= 12; ubuntu-22.04 defaults to gcc-11.
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Build EUnifyer Office
        env:
          SKIP_CLONE: false
          CCACHE_DIR: ~/.ccache
        run: ./scripts/build.sh

      - name: Package (.tar.gz / .deb / .AppImage)
        run: ./scripts/package-linux.sh "${{ steps.ver.outputs.version }}"

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum EUnifyer-Office-*-linux-* > SHA256SUMS-linux || true
          cat SHA256SUMS-linux || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eunifyer-office-linux-${{ steps.ver.outputs.version }}
          path: |
            dist/EUnifyer-Office-*-linux-*
            dist/SHA256SUMS-linux
          retention-days: 30

      - name: Publish to eunify-office-dist
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.OFFICE_DIST_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: EUnifyer/eunify-office-dist
          token: ${{ secrets.OFFICE_DIST_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: EUnifyer Office ${{ github.ref_name }}
          files: |
            dist/EUnifyer-Office-*-linux-*
            dist/SHA256SUMS-linux
