name: Build macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      OFFICE_DIST_TOKEN: ${{ secrets.OFFICE_DIST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          # GNU make >= 4.2 (brew's `make` provides `gmake`; macOS ships 3.81),
          # plus the autotools LibreOffice's autogen.sh needs.
          brew install autoconf automake gperf make
          brew install ccache
          brew install openjdk@17
          echo "JAVA_HOME=$(brew --prefix openjdk@17)" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Build EUnifyer Office
        env:
          SKIP_CLONE: false
          CCACHE_DIR: ~/.ccache
        run: |
          # Arch-agnostic ccache wrappers (arm64 runners use /opt/homebrew).
          export PATH="$(brew --prefix)/opt/ccache/libexec:$PATH"
          ./scripts/build.sh

      - name: Package + sign + notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./scripts/package-macos.sh "${{ steps.ver.outputs.version }}"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 EUnifyer-Office.dmg > SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eunifyer-office-macos-${{ steps.ver.outputs.version }}
          path: |
            dist/EUnifyer-Office.dmg
            dist/SHA256SUMS
          retention-days: 30

      # Publish to the public binaries-only mirror the landing page downloads
      # from. Requires OFFICE_DIST_TOKEN (a PAT with `contents:write` on
      # EUnifyer/eunify-office-dist). No-ops on non-tag runs.
      - name: Publish to eunify-office-dist
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.OFFICE_DIST_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: EUnifyer/eunify-office-dist
          token: ${{ secrets.OFFICE_DIST_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: EUnifyer Office ${{ github.ref_name }}
          files: |
            dist/EUnifyer-Office.dmg
            dist/SHA256SUMS
